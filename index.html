<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>atelier by Roleplay+</title>
    <script>
      /* Apply the stored / system theme before first paint (see src/lib/theme.ts). */
      try {
        var m = localStorage.getItem("atelier:theme") || "system";
        var d = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        var e = document.documentElement;
        e.dataset.theme = d ? "dark" : "light";
        e.classList.toggle("dark", d);
      } catch (_) {}
    </script>
    <style>
      html { background: #fbfbfd; }
      html[data-theme="dark"] { background: #0e0e13; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
